name: Deploy SOLARIS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Verify public preview content and directory
        run: |
          node --import tsx scripts/verify-exploration-content.ts --public-preview
          node --import tsx scripts/import-earth-directory.mjs --check
          node scripts/verify-content-pack.mjs
      - name: Build and verify website
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          node scripts/verify-static-export.mjs
      - name: Build isolated original gesture website
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: node scripts/build-classic.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
