<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOLARIS · 手势回归测试</title>
  </head>
  <body>
    <div id="root"></div>
    <aside
      id="lab"
      style="
        position: fixed;
        z-index: 100;
        bottom: 100px;
        left: 16px;
        max-width: 300px;
        padding: 12px;
        background: #12171eef;
        color: #ddd;
        border: 1px solid #456;
        font: 12px sans-serif;
        line-height: 1.8;
      "
    >
      <strong>合成 21 关键点回放 · 不使用摄像头</strong>
      <div id="lab-buttons">
        <button data-target="earth">指向地球</button>
        <button data-target="sun">指向太阳</button>
        <button data-target="help">指向帮助</button>
        <button data-target="blank">指向空白</button>
        <button data-motion="thumb-open">张开大拇指并保持</button>
        <button data-motion="thumb-close">收回大拇指</button>
        <button data-motion="thumb-already-open">拇指已张开（不进入）</button>
        <button data-motion="index-partial">半弯食指（不进入）</button>
        <button data-motion="index-press">弯曲食指（不进入）</button>
        <button data-motion="index-release">伸直食指（保持拇指收回）</button>
        <button data-motion="index-jitter">直指轻微抖动</button>
        <button data-motion="index-slow">缓慢放松食指</button>
        <button data-pose="PINCH">旧捏合不选择</button>
        <button data-pose="OPEN_PALM">松开张掌</button>
        <button data-pose="FIST">握拳返回</button>
        <button data-motion="drag">空白捏住拖动</button>
        <button data-motion="swipe-left">向左拨动</button>
        <button data-motion="swipe-right">向右拨动</button>
        <button data-motion="join">双掌缓慢合拢</button>
        <button data-motion="join-noisy">自然合拢含识别波动</button>
        <button data-motion="expand">双掌展开重生</button>
        <button data-motion="focus-v">进入地球后旋转缩放</button>
        <button data-motion="v-still">✌ 保持不转</button>
        <button data-motion="v-right-hand-in">右手向右拧</button>
        <button data-motion="v-right-hand-out">右手向左拧</button>
        <button data-motion="v-left-hand-in">左手向右拧</button>
        <button data-motion="v-left-hand-out">左手向左拧</button>
        <button data-motion="v-jitter">✌ ±5° 抖动</button>
        <button data-motion="v-translate">✌ 快速平移</button>
        <button data-motion="v-missing">✌ 旋转含两帧漏检</button>
        <button data-pose="FIVE_PINCH">旧五指不触发</button>
        <button data-motion="reentry">捏着重新入镜</button>
        <button data-pose="NONE">移开手</button>
        <button data-preview="true">模拟摄像头预览</button>
        <button data-slow="true">慢放坍缩动画</button>
      </div>
      <output
        id="lab-result"
        style="display: block; height: 150px; overflow: auto"
      ></output>
    </aside>
    <script type="module" src="./gesture-lab.ts"></script>
  </body>
</html>
