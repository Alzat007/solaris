<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOLARIS · 模型兼容回归</title>
  </head>
  <body>
    <div id="root"></div>
    <aside
      style="
        position: fixed;
        z-index: 100;
        bottom: 100px;
        left: 16px;
        width: 330px;
        max-height: calc(100vh - 140px);
        overflow: auto;
        background: #101c26ef;
        color: #ddd;
        padding: 12px;
        font: 12px/1.7 sans-serif;
      "
    >
      <strong>模型实跑 · 合成摄像头 · 无真实摄像头权限</strong>
      <p>只替换摄像头输入；真实模型、切换按钮与追踪链路保持运行。</p>
      <button id="blank">空白画面</button
      ><button id="sample">展示官方手部样图</button>
      <button id="victory">展示官方 V 手势样图</button>
      <button id="pointing-up">展示官方 POINT 原图（伸直）</button>
      <button id="fist">展示官方握拳样图</button>
      <div style="margin-top: 8px">
        <button id="mirror" aria-pressed="false">镜像样图：关</button>
        <button id="rotate-right">向右旋转 30°</button>
        <button id="rotate-left">向左旋转 30°</button>
        <button id="rotate-reset">旋转归零</button>
      </div>
      <output id="camera-result" style="display: block"></output>
    </aside>
    <script type="module" src="./camera-lab.ts"></script>
  </body>
</html>
